<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Audio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div>
        <h1>STAGE AUDIO</h1>
        <p>文化祭 音響コントローラー</p>
    </div>

    <div class="header-actions">
        <button id="shareButton" class="share-button">
            🔗 共有
        </button>

        <div class="status">
            <span class="status-dot"></span>
            READY
        </div>
    </div>
</header>


<main>

    <!-- =========================
         NOW PLAYING
    ========================== -->

    <section class="player-section">

        <p class="section-label">NOW PLAYING</p>

        <h2 id="nowPlaying">
            まだ再生されていません
        </h2>

        <!-- YouTubeプレイヤー -->
        <div id="player"></div>

        <!-- ローカル音源用 -->
        <audio id="localAudio"></audio>


        <div class="main-controls">

            <button id="playPauseButton">
                ▶ 再生
            </button>

            <button id="stopButton">
                ■ STOP
            </button>

            <button id="fadeButton" class="fade-button">
                ↘ FADE OUT
            </button>

        </div>


        <!-- 音量 -->

        <div class="volume-area">

            <span>🔊</span>

            <input
                type="range"
                id="volumeSlider"
                min="0"
                max="100"
                value="80"
            >

            <span id="volumeValue">
                80%
            </span>

        </div>


        <!-- FADE -->

        <div class="fade-settings">

            <span>FADE</span>

            <button class="fade-time" data-time="1">
                1秒
            </button>

            <button class="fade-time active" data-time="3">
                3秒
            </button>

            <button class="fade-time" data-time="5">
                5秒
            </button>

            <button class="fade-time" data-time="10">
                10秒
            </button>

            <button id="customFadeButton">
                ＋ CUSTOM
            </button>

        </div>


        <!-- カスタムFADE -->

        <div
            id="customFadeArea"
            class="custom-fade-area hidden"
        >

            <input
                type="number"
                id="customFadeInput"
                min="0.5"
                max="120"
                step="0.5"
                placeholder="例：7"
            >

            <span>秒</span>

            <button id="addCustomFadeButton">
                追加
            </button>

        </div>

    </section>


    <!-- =========================
         CUE LIST
    ========================== -->

    <section class="cue-section">

        <div class="cue-header">

            <div>
                <p class="section-label">
                    CUE LIST
                </p>

                <h2>音源リスト</h2>
            </div>


            <div class="cue-add-buttons">

                <button
                    id="youtubeModeButton"
                    class="add-button"
                >
                    ＋ YouTube
                </button>

                <button
                    id="audioFileButton"
                    class="file-button"
                >
                    ＋ 音源ファイル
                </button>

            </div>

        </div>


        <!-- YouTube追加 -->

        <div
            id="youtubeAddArea"
            class="add-cue-area"
        >

            <input
                id="youtubeUrl"
                type="text"
                placeholder="YouTube URLを貼り付け"
            >

            <input
                id="cueName"
                type="text"
                placeholder="名前（例：ハク登場）"
            >

            <button id="saveCueButton">
                追加
            </button>

        </div>


        <!-- MP3など -->

        <input
            id="audioFileInput"
            type="file"
            accept="audio/*"
            hidden
        >


        <div id="cueList">

            <div class="empty-message">
                まだCUEがありません。<br>
                YouTubeまたは音源ファイルを追加してください。
            </div>

        </div>


        <div class="next-controls">

            <button id="previousButton">
                ← PREVIOUS
            </button>

            <button id="nextButton">
                NEXT CUE →
            </button>

        </div>

    </section>

</main>


<div
    id="toast"
    class="toast"
>
    URLをコピーしました
</div>


<script src="script.js"></script>

</body>
</html>
